<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字数カウンター</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --duck-yellow: #FFEB3B; /* 明るい黄色 */
            --duck-dark-yellow: #FDD835; /* 影用の少し濃い黄色 */
            --duck-orange: #FF9800; /* くちばしのオレンジ */
            --water-blue: #E1F5FE; /* 水背景の色 */
            --text-color: #5D4037; /* 茶色いテキスト */
        }

        body {
            font-family: 'M PLUS Rounded 1c', "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
            background-color: var(--water-blue);
            /* 水玉模様の背景 */
            background-image: radial-gradient(#B3E5FC 20%, transparent 20%), radial-gradient(#B3E5FC 20%, transparent 20%);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
            
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--text-color);
        }

        .duck-container {
            background: var(--duck-yellow);
            padding: 40px;
            border-radius: 40px 40px 60px 60px; /* 下の方を少しぽってりさせる */
            box-shadow: 
                0 10px 20px rgba(0,0,0,0.1),
                inset 0 -10px 20px rgba(255,152,0,0.2); /* 内側に少しオレンジの影 */
            width: 100%;
            max-width: 700px;
            position: relative;
            border: 8px solid var(--duck-dark-yellow);
        }
        
        /* ラバーダックの顔パーツ（装飾） */
        .duck-face {
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }
        .duck-eyes {
            display: inline-block;
            width: 20px;
            height: 20px;
            background: #333;
            border-radius: 50%;
            margin: 0 10px;
            position: relative;
        }
        .duck-eyes::after { /* 目のハイライト */
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }
        .duck-beak {
            width: 60px;
            height: 30px;
            background: var(--duck-orange);
            border-radius: 30px;
            margin: 5px auto 0;
            border: 3px solid #F57C00;
        }

        h1 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--text-color);
            font-weight: bold;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 常に3列で表示 */
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: #FFF9C4; /* 薄い黄色 */
            padding: 15px 10px;
            border-radius: 25px; /* 丸っこく */
            text-align: center;
            border: 4px solid var(--duck-dark-yellow);
            box-shadow: 0 4px 0 rgba(0,0,0,0.05);
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-color);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--duck-orange);
        }

        textarea {
            width: 100%;
            height: 250px;
            padding: 20px;
            border: 5px solid var(--duck-dark-yellow);
            border-radius: 25px;
            font-size: 18px;
            resize: vertical;
            box-sizing: border-box;
            font-family: inherit; /* フォントを継承 */
            background-color: #FFFDE7; /* とても薄い黄色 */
            color: var(--text-color);
            outline: none;
        }

        textarea:focus {
            border-color: var(--duck-orange);
            box-shadow: 0 0 0 4px rgba(255,152,0,0.3);
        }
        
        textarea::placeholder {
            color: rgba(93, 64, 55, 0.5);
        }

    </style>
</head>
<body>

<div class="duck-container">
    <div class="duck-face">
        <div><span class="duck-eyes"></span><span class="duck-eyes"></span></div>
        <div class="duck-beak"></div>
    </div>

    <h1>かぞえるクワッ！</h1>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">ぜんぶで</div>
            <div class="stat-value" id="count-all">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">くうはくなし</div>
            <div class="stat-value" id="count-no-space">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">ぎょうすう</div>
            <div class="stat-value" id="count-lines">0</div>
        </div>
    </div>

    <textarea id="text-input" placeholder="ここに入力するクワ..."></textarea>
</div>

<script>
    // JavaScriptのロジックは前回と同じです
    const textInput = document.getElementById('text-input');
    const countAllEl = document.getElementById('count-all');
    const countNoSpaceEl = document.getElementById('count-no-space');
    const countLinesEl = document.getElementById('count-lines');

    textInput.addEventListener('input', () => {
        const text = textInput.value;

        // 1. 全文字数
        const lengthAll = text.length;

        // 2. 空白なし (スペース、タブ、改行を除去)
        const lengthNoSpace = text.replace(/\s/g, '').length;

        // 3. 行数
        const lines = text === '' ? 0 : text.split(/\n/).length;

        // 結果を画面に反映
        countAllEl.textContent = lengthAll.toLocaleString();
        countNoSpaceEl.textContent = lengthNoSpace.toLocaleString();
        countLinesEl.textContent = lines.toLocaleString();
    });
</script>

</body>
</html>
